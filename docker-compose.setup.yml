# Fresh-install demo: shows the first-run setup a new user goes through, on an empty database.
# Runs next to the sample-data demo:  docker compose -f docker-compose.setup.yml up --build -d
# Then open http://localhost:3001. Remove it (and its data) with:  docker compose -f docker-compose.setup.yml down -v
name: mizan-setup
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: mizan
      POSTGRES_DB: mizan
    volumes:
      - mizan-setup-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgres://mizan:mizan@db:5432/mizan
      DATABASE_SSL: "false"
      COOKIE_SECURE: "false"

volumes:
  mizan-setup-db:
