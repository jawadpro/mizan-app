# Self-hosting: `docker compose up --build -d`, then open http://localhost:3000.
# Starts on an empty database and opens the setup wizard (passphrase, banks, your name, iPhone).
# There is no sample data here. Stop it with `docker compose down`; add -v only to erase your data.
name: mizan
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: mizan
      POSTGRES_DB: mizan
    volumes:
      - mizan-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://mizan:mizan@db:5432/mizan
      DATABASE_SSL: "false"
      COOKIE_SECURE: "false"

volumes:
  mizan-data:
